<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon-style</title>
    <style>
        .amazon{
            background-color: yellow;
            border: 3px solid ;
        }
        .buy{
            background-color: orange;
            border: 3px solid;
        }
    </style>
</head>
<body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price:$7.99</p>
    <button class="amazon" onclick="popup()">Add to cart</button>
    <button class="buy" onclick="purchased()">Buy now</button>

    <script>
        function popup(){
            console.log(alert('Added'));
        }
        function purchased(){
            console.log('Loading');
            console.log(alert('Purchased'));
        }
    </script>
</body>
</html>
