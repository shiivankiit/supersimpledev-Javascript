<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length-Conversion</title>
</head>
<body>
    <script>
        function convertLength(length,from,to){
            if(from==='miles' && to==='km'){
                return `${length*1.6}miles`;
            }
        }
    </script>
</body>
