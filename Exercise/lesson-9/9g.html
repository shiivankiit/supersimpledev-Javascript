<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon-Shipping-Calculator</title>
  </head>
  <body>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = Free shipping</p>
    <input type="Cost of order" class="cost-value"
    onkeydown="console.log(event.key);
    if(event.key === 'Enter'){
        CalculateTotal();
    }
    "
    />
    <button onclick="CalculateTotal()">Calculate</button>
    <p class="cost"></p>
    <script>
      function CalculateTotal() {
        const inputValue = document.querySelector(".cost-value");
        let cost = Number(inputValue.value);
        if (cost < 40) {
          cost = Math.round(cost+10);
        }else{
            cost='Free shipping';
        }
        document.querySelector(".cost").innerHTML = `$${cost}`;
      }
    </script>
  </body>
</html>
