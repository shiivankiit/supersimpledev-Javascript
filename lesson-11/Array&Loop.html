<body>
    <script>
        const myArray=[10,20,30]
        console.log(myArray);
        console.log(myArray[0]);
        console.log(myArray[0]=10);

        const myArray2=[1,'hello',true,{name:'socks'},[1,2]];
        console.log(typeof [1,2]);
        console.log(Array.isArray([1,2]));
        
        console.log(myArray.length);

        myArray.push(100);

        //Loops
        //--while loop.
        let i=1;
        while(i<=5){
            console.log(i);
            i=i+1;
        }

        for(let i=0;i<=5;i++){
            console.log(i);
        }

    </script>
