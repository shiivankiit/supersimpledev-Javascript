<!-- Boolean and If-Statements -->
<!-- There are only 2 boolean values:-true,false -->
<!-- A boolean value represents whether something is tru or false. -->

<!-- if-statement:-let us write multiple groups of code
 --and then decide which code to run
 Scope helps up avoid naming conflicts.
 -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    console.log(3>5-5);
    console.log(5==='5.0');
    
    if(30>=16){
      console.log('You can drive');
    }else{
      console.log('You can not drive');
    }
    console.log(true && false);
    console.log(0.2>=0 && 0.2<1/3);
    console.log(true||false);
    console.log(!false);
    
    //Truthy and falsy values.
    if(0){
      console.log('truthy');
    }
    const cartQuantity=5;
    if(cartQuantity){
      console.log('cart has products');
    }
    console.log(!0);


    // Ternary operator.
    const result = 0 ? 'truthy' : 'falsy';
    console.log(result);
    
    
  </script>
</body>
</html>
