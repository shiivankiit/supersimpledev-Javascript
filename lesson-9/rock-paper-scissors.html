<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <link rel="stylesheet" href="rock.css" />
  <body>
    <p class="heading">Rock Paper Scissors</p>
    <button class="move-btn" onclick="playGame('rock')">
      <img class="move-icon" src="images/rock-emoji.png" alt="" />
    </button>

    <button class="move-btn" onclick="playGame('paper')">
      <img class="move-icon" src="images/paper-emoji.png" alt="" />
    </button>

    <button class="move-btn" onclick="playGame('scissors')">
      <img class="move-icon" src="images/scissors-emoji.png" alt="" />
    </button>
    <p class="js-result result"></p>
    <p class="js-moves"></p>

    <p class="js-score score"></p>

    <button
      class="reset-score"
      ,
      onclick="
        ((score.wins = 0), (score.losses = 0), (score.ties = 0));
        localStorage.removeItem('score');
        updateScoreElement();
      "
    >
      Reset Score
    </button>
    <script src="rock.js"></script>
  </body>
</html>
