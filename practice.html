<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissor</title>
  </head>
  <body>
    <p>Rock-Paper-Scissor</p>
    <button onclick="playGame('Rock')">Rock</button>
    <button onclick="playGame('Paper')">Paper</button>
    <button onclick="playGame('Scissor')">Scissor</button>
    <button onclick="resetScore()">Reset Score</button>
    <script>
      let score = {
        Win: 0,
        Lose: 0,
        Tie: 0,
      }; 
      //Reset value.
        function resetScore(){
          score.Win=0;
          score.Lose=0;
          score.Tie=0;
          alert("Value reset");
        }
        
      function playGame(playerMove) {
       
        let computerpick = computerMove(); //stores the computer move in the variable.
        let result = ""; //stores the value

        if (computerpick === "Rock") {
          if (playerMove === "Rock") {
            result = "Tie";
          } else if (playerMove === "Paper") {
            result = "Win";
          } else if (playerMove === "Scissor") {
            result = "Lose";
          }
        } else if (computerpick === "Scissor") {
          if (playerMove === "Rock") {
            result = "Win";
          } else if (playerMove === "Paper") {
            result = "Lose";
          } else if (playerMove === "Scissor") {
            result = "Tie";
          }
        } else if (computerpick === "Paper") {
          if (playerMove === "Paper") {
            result = "Tie";
          } else if (playerMove === "Scissor") {
            result = "Win";
          } else if (playerMove === "Rock") {
            result = "Lose";
          }
        }
        if (result === "Win") {
          score.Win++;
        } else if (result === "Lose") {
          score.Lose++;
        } else {
          score.Tie++;
        }
        alert(
          `You choose ${playerMove} and Computer choose ${computerpick} ,You ${result}
Wins:${score.Win}, Losses:${score.Lose},Ties:${score.Tie}`,
        );
      }
      //First computer will choose random value.
      function computerMove() {
        const randomMove = Math.random();
        let computerMove = "";
        if (randomMove > 0 && randomMove < 1 / 3) {
          computerMove = "Rock";
        } else if (randomMove > 1 / 3 && randomMove < 2 / 3) {
          computerMove = "Paper";
        } else if (randomMove > 2 / 3 && randomMove < 1) {
          computerMove = "Scissor";
        }
        return computerMove;
      }
    </script>
  </body>
</html>
